---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: ai-platform
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: ai-platform
data:
  01-schema.sql: |
    CREATE TABLE IF NOT EXISTS sessions (
        session_id  uuid        PRIMARY KEY,
        app         text        NOT NULL,
        subject     text        NOT NULL,
        created_at  timestamptz NOT NULL DEFAULT now(),
        last_seen   timestamptz NOT NULL DEFAULT now(),
        meta        jsonb       NOT NULL DEFAULT '{}'::jsonb
    );
    CREATE INDEX IF NOT EXISTS idx_sessions_app_subject_seen
        ON sessions (app, subject, last_seen DESC);

    CREATE TABLE IF NOT EXISTS documents (
        document_id     uuid        PRIMARY KEY,
        app             text        NOT NULL,
        owner_subject   text        NOT NULL,
        filename        text        NOT NULL,
        content_sha256  char(64)    NOT NULL,
        bytes           bigint      NOT NULL,
        page_count      integer,
        object_key      text        NOT NULL,
        group_id        text        NOT NULL,
        created_at      timestamptz NOT NULL DEFAULT now(),
        UNIQUE (app, owner_subject, content_sha256)
    );
    CREATE INDEX IF NOT EXISTS idx_documents_owner
        ON documents (app, owner_subject, created_at DESC);

    CREATE TABLE IF NOT EXISTS document_jobs (
        job_id       uuid        PRIMARY KEY,
        document_id  uuid        NOT NULL REFERENCES documents (document_id) ON DELETE CASCADE,
        state        text        NOT NULL DEFAULT 'queued',
        chunks_total integer,
        chunks_done  integer     NOT NULL DEFAULT 0,
        attempts     integer     NOT NULL DEFAULT 0,
        error        text,
        claimed_at   timestamptz,
        created_at   timestamptz NOT NULL DEFAULT now(),
        updated_at   timestamptz NOT NULL DEFAULT now()
    );
    CREATE INDEX IF NOT EXISTS idx_document_jobs_claimable
        ON document_jobs (state, updated_at);
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres
  namespace: ai-platform
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: ai-platform
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ai-platform
  labels:
    app.kubernetes.io/name: postgres
    app: postgres
    app.kubernetes.io/part-of: ai-platform
    app.kubernetes.io/component: session-store
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: ai-platform
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: ai-platform
    app.kubernetes.io/component: session-store
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app: postgres
        app.kubernetes.io/part-of: ai-platform
        app.kubernetes.io/component: session-store
    spec:
      serviceAccountName: postgres
      automountServiceAccountToken: false
      priorityClassName: platform-data
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16.4-bookworm
          imagePullPolicy: IfNotPresent
          args:
            - "-c"
            - "max_connections=40"
            - "-c"
            - "shared_buffers=128MB"
            - "-c"
            - "work_mem=4MB"
            - "-c"
            - "maintenance_work_mem=32MB"
            - "-c"
            - "effective_cache_size=384MB"
            - "-c"
            - "jit=off"
          envFrom:
            - secretRef:
                name: postgres-creds
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" -h 127.0.0.1'
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 40
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -h 127.0.0.1 -tAc "SELECT 1" | grep -q 1'
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" -h 127.0.0.1'
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 250m
              memory: 448Mi
            limits:
              cpu: "2"
              memory: 448Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 999
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: init
          configMap:
            name: postgres-init
        - name: run
          emptyDir:
            sizeLimit: 32Mi
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: postgres
          app.kubernetes.io/part-of: ai-platform
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 3Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-allow-ingress
  namespace: ai-platform
  labels:
    app.kubernetes.io/part-of: ai-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: agent-backend
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: pgadmin
      ports:
        - protocol: TCP
          port: 5432
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ai-observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: alloy
      ports:
        - protocol: TCP
          port: 5432
