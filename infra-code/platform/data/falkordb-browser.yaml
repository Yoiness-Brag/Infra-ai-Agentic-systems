---
apiVersion: v1
kind: Service
metadata:
  name: falkordb-browser
  namespace: ai-platform
  labels:
    app.kubernetes.io/name: falkordb-browser
    app.kubernetes.io/part-of: ai-platform
    app.kubernetes.io/component: graph-memory-ui
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: falkordb-browser
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 30302
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: falkordb-browser
  namespace: ai-platform
  labels:
    app.kubernetes.io/name: falkordb-browser
    app.kubernetes.io/part-of: ai-platform
    app.kubernetes.io/component: graph-memory-ui
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: falkordb-browser
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: falkordb-browser
        app: falkordb-browser
        app.kubernetes.io/part-of: ai-platform
        app.kubernetes.io/component: graph-memory-ui
    spec:
      automountServiceAccountToken: false
      priorityClassName: platform-observability
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: browser
          image: falkordb/falkordb:v4.2.2
          imagePullPolicy: IfNotPresent
          workingDir: /FalkorDBBrowser
          command: ["node", "server.js"]
          env:
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: PORT
              value: "3000"
            - name: HOME
              value: /tmp
            - name: NEXT_TELEMETRY_DISABLED
              value: "1"
            - name: FALKORDB_URL
              value: "falkordb://falkordb.ai-platform:6379"
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 999
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: falkordb-browser-allow
  namespace: ai-platform
  labels:
    app.kubernetes.io/part-of: ai-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: falkordb-browser
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: falkordb
      ports:
        - protocol: TCP
          port: 6379
