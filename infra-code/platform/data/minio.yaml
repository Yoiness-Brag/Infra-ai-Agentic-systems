---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: minio
  namespace: ai-platform
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: ai-platform
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: ai-platform
  labels:
    app.kubernetes.io/name: minio
    app: minio
    app.kubernetes.io/part-of: ai-platform
    app.kubernetes.io/component: object-store
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: minio
  ports:
    - name: api
      port: 9000
      targetPort: api
      protocol: TCP
    - name: console
      port: 9001
      targetPort: console
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: minio-console
  namespace: ai-platform
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: ai-platform
    app.kubernetes.io/component: object-store
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: minio
  ports:
    - name: console
      port: 9001
      targetPort: console
      nodePort: 30901
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: ai-platform
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: ai-platform
    app.kubernetes.io/component: object-store
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
        app: minio
        app.kubernetes.io/part-of: ai-platform
        app.kubernetes.io/component: object-store
    spec:
      serviceAccountName: minio
      automountServiceAccountToken: false
      priorityClassName: platform-data
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minio
          image: pgsty/silo:RELEASE.2026-08-06T00-00-00Z
          imagePullPolicy: IfNotPresent
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: CI_CD
              value: "true"
            - name: HOME
              value: /tmp
            - name: MINIO_PROMETHEUS_AUTH_TYPE
              value: public
            - name: MINIO_UPDATE
              value: "off"
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-creds
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-creds
                  key: MINIO_ROOT_PASSWORD
          ports:
            - name: api
              containerPort: 9000
              protocol: TCP
            - name: console
              containerPort: 9001
              protocol: TCP
          startupProbe:
            httpGet:
              path: /minio/health/live
              port: api
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: api
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: minio
          app.kubernetes.io/part-of: ai-platform
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: minio-allow-ingress
  namespace: ai-platform
  labels:
    app.kubernetes.io/part-of: ai-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: minio
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: agent-backend
      ports:
        - protocol: TCP
          port: 9000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ai-observability
      ports:
        - protocol: TCP
          port: 9000
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 9001
