apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: infra-ai-mvp
  namespace: argocd
spec:
  description: Infra-AI agentic platform (L1..L7) on k3d
  sourceRepos:
    - https://github.com/Yoiness-Brag/Infra-ai-Agentic-systems.git
    - https://charts.konghq.com
    - https://kedacore.github.io/charts
    - https://langfuse.github.io/langfuse-k8s
    - https://grafana.github.io/helm-charts
    - ghcr.io/kagent-dev/kagent/helm
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd
    - server: https://kubernetes.default.svc
      namespace: ai-gateway
    - server: https://kubernetes.default.svc
      namespace: ai-platform
    - server: https://kubernetes.default.svc
      namespace: kagent
    - server: https://kubernetes.default.svc
      namespace: ai-observability
    - server: https://kubernetes.default.svc
      namespace: keda
    - server: https://kubernetes.default.svc
      namespace: kube-system
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: scheduling.k8s.io
      kind: PriorityClass
    - group: apiregistration.k8s.io
      kind: APIService
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: networking.k8s.io
      kind: IngressClass
    - group: storage.k8s.io
      kind: StorageClass
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
