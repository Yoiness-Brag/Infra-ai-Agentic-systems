image:
  repository: kong
  tag: "3.9.3"

env:
  database: "off"
  nginx_worker_processes: "2"
  mem_cache_size: "64m"
  log_level: notice

dblessConfig:
  secret: kong-declarative

customEnv:
  jwt_secret:
    valueFrom:
      secretKeyRef:
        name: jwt-secret
        key: JWT_SECRET
  jwt_iss:
    valueFrom:
      secretKeyRef:
        name: jwt-secret
        key: JWT_ISS
  google_api_key:
    valueFrom:
      secretKeyRef:
        name: gemini-api
        key: GOOGLE_API_KEY

ingressController:
  enabled: false

proxy:
  enabled: true
  type: LoadBalancer
  http:
    enabled: true
    servicePort: 80
    containerPort: 8000
  tls:
    enabled: false
  nameOverride: kong-proxy

admin:
  enabled: false

manager:
  enabled: false

status:
  enabled: true
  http:
    enabled: true
    containerPort: 8100

replicaCount: 1

updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

priorityClassName: platform-core

resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    cpu: "2"
    memory: 384Mi

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  enabled: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault
  capabilities:
    drop:
      - ALL

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8100"
  prometheus.io/path: /metrics
