---
apiVersion: v1
kind: LimitRange
metadata:
  name: default-container-limits
  namespace: ai-gateway
  labels:
    app.kubernetes.io/part-of: infra-ai-mvp
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 128Mi
      default:
        cpu: 500m
        memory: 384Mi
      max:
        memory: 1Gi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: namespace-budget
  namespace: ai-gateway
  labels:
    app.kubernetes.io/part-of: infra-ai-mvp
spec:
  hard:
    requests.memory: 768Mi
    limits.memory: 1536Mi
    requests.cpu: "1"
    pods: "12"
