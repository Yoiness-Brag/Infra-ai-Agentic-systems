---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keda-allow-apiserver-egress
  namespace: keda
  labels:
    app.kubernetes.io/part-of: infra-ai-mvp
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.42.0.0/16
              - 10.43.0.0/16
              - 169.254.0.0/16
      ports:
        - protocol: TCP
          port: 6443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ai-observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9090
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keda-allow-metrics-ingress
  namespace: keda
  labels:
    app.kubernetes.io/part-of: infra-ai-mvp
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 6443
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 9666
        - protocol: TCP
          port: 9443
