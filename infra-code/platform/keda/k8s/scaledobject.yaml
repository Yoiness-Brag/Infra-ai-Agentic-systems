---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: agent-backend
  namespace: ai-platform
  labels:
    app.kubernetes.io/name: agent-backend
    app.kubernetes.io/part-of: ai-platform
spec:
  scaleTargetRef:
    name: agent-backend
  minReplicaCount: 1
  maxReplicaCount: 3
  pollingInterval: 15
  cooldownPeriod: 180
  advanced:
    restoreToOriginalReplicaCount: true
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Pods
              value: 1
              periodSeconds: 30
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 50
              periodSeconds: 60
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus.ai-observability:9090
        query: sum(agent_backend_in_flight_requests)
        threshold: "4"
        activationThreshold: "0.5"
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: agent-backend
  namespace: ai-platform
  labels:
    app.kubernetes.io/name: agent-backend
    app.kubernetes.io/part-of: ai-platform
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-backend
